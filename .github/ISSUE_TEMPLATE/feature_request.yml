name: Feature request
description: Suggest something TigerSlicer should do
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like TigerSlicer to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
      description: The print or workflow this would help with.
