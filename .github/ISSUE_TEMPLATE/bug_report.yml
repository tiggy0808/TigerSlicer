name: Bug report
description: Something in TigerSlicer doesn't work as expected
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: TigerSlicer version
      description: Shown in Help → About TigerSlicer.
      placeholder: e.g. 0.0.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: printer
    attributes:
      label: Printer
      description: The printer profile you were using, if it matters.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Project file and logs
      description: >
        Attach the project (.3mf) if you can. For a crash, also attach the logs
        (Help → Show Configuration Folder, then the `log` folder).
