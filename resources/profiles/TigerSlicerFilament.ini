# TigerSlicer first-party filament library.
#
# One profile per material, named by what the material is rather than
# by who sells it. Values are PrusaSlicer's own template values with
# the inheritance chains flattened; the profiles carry no printer
# compatibility condition, so they apply to every FDM printer.

[vendor]
repo_id = non-prusa-fff
name = TigerSlicer Filaments
config_version = 1.0.1

