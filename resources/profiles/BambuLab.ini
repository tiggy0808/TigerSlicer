[printer:*common printer*]
printer_technology = FFF
gcode_flavor = marlin2
use_relative_e_distances = 1
use_firmware_retraction = 0
use_volumetric_e = 0
variable_layer_height = 1
extruder_offset = 0x0
retract_length = 0.8
retract_speed = 30
deretract_speed = 30
retract_lift = 0.4
retract_before_travel = 1
retract_layer_change = 1
wipe = 1
retract_before_wipe = 70%
z_offset = 0
machine_limits_usage = time_estimate_only
machine_max_feedrate_z = 20
machine_max_feedrate_e = 30
machine_max_acceleration_z = 500
machine_max_acceleration_e = 5000
machine_max_jerk_x = 9
machine_max_jerk_y = 9
machine_max_jerk_z = 3
machine_max_jerk_e = 3
machine_min_extruding_rate = 0
machine_min_travel_rate = 0
silent_mode = 0
default_filament_profile = Bambu PLA Basic @BBL
start_gcode = G90 ; absolute XYZ\nM83 ; relative E\nM140 S[first_layer_bed_temperature] ; start bed heating\nM104 S170 ; preheat nozzle without oozing\nG28 ; home\nM190 S[first_layer_bed_temperature] ; wait for bed\nM109 S[first_layer_temperature] ; wait for nozzle\nG1 Z5 F3000\nG1 X2 Y2 F6000 ; purge line start\nG1 Z0.3 F600\nG1 X62 E9 F1000\nG1 X102 E12.5 F1000\nG1 Z1 F600 ; end of purge
end_gcode = M104 S0 ; nozzle off\nM140 S0 ; bed off\nG91\nG1 Z2 F600 ; lift\nG90\nG1 X0 Y{print_bed_max[1] - 10} F6000 ; present print\nM107 ; fan off\nM84 ; motors off

