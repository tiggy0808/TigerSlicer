# Bambu Lab printer profiles for TigerSlicer.
# The start/end G-code is a plain Marlin-style sequence, not the factory
# calibration macro set - review the program before sending it to a machine.

[vendor]
repo_id = non-prusa-fff
name = Bambu Lab
config_version = 1.0.0

[printer_model:X1C]
name = Bambu Lab X1 Carbon
variants = 0.4; 0.2; 0.6; 0.8
technology = FFF
family = X1
thumbnail = X1C_thumbnail.png
default_materials = Bambu PLA Basic @BBL; Bambu PLA Matte @BBL; Bambu PETG HF @BBL; Generic PLA @BBL; Generic PETG @BBL; Generic ABS @BBL

[printer_model:X1E]
