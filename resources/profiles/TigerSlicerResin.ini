# TigerSlicer first-party generic MSLA profile. This bundle is intentionally
# offline and conservative: automatic supports and hollowing are opt-in.

[vendor]
repo_id = non-prusa-sla
name = TigerSlicer Resin
config_version = 1.4.0

[printer_model:Generic 3840x2400 MSLA]
name = Generic 3840x2400 MSLA
variants = default
technology = SLA
family = Generic
default_materials = Generic Standard Resin @MSlicer

[sla_print:0.05 mm MSlicer Standard]
compatible_printers_condition = printer_notes=~/.*TIGERSLICER_MSLICER.*/
resin_print_schema_version = 1
layer_height = 0.05
mslicer_bottom_layers = 4
mslicer_transition_layers = 6
mslicer_supersample = 1
supports_enable = 0
pad_enable = 0
hollowing_enable = 0
filename_format = [input_filename_base]

[sla_material:Generic Standard Resin @MSlicer]
compatible_printers_condition = printer_notes=~/.*TIGERSLICER_MSLICER.*/
compatible_prints_condition = layer_height >= 0.025 and layer_height <= 0.1
resin_material_schema_version = 1
exposure_time = 2.5
initial_exposure_time = 30
initial_layer_height = 0.05
mslicer_normal_wait_time = 0.5
mslicer_bottom_wait_time = 1
mslicer_normal_pwm = 255
mslicer_bottom_pwm = 255
mslicer_normal_lift_distance = 5
mslicer_normal_lift_speed = 60
mslicer_normal_retract_distance = 5
mslicer_normal_retract_speed = 120
mslicer_bottom_lift_distance = 6
mslicer_bottom_lift_speed = 45
mslicer_bottom_retract_distance = 6
mslicer_bottom_retract_speed = 90
material_colour = #F6A5C1
material_density = 1.1
material_type = Tough
material_vendor = Generic

[printer:MSlicer Generic 3840x2400]
printer_technology = SLA
resin_printer_schema_version = 1
resin_supported_formats = ctb;goo;nanodlp
printer_model = Generic 3840x2400 MSLA
printer_variant = default
default_sla_material_profile = Generic Standard Resin @MSlicer
default_sla_print_profile = 0.05 mm MSlicer Standard
printer_notes = TIGERSLICER_MSLICER\nReview the exact display dimensions, orientation, image mirrors, exposure, and motion values for your printer before export.
printable_area = 0x0,192x0,192x120,0x120
printable_height = 200
display_pixels_x = 3840
display_pixels_y = 2400
display_width = 192
display_height = 120
display_orientation = landscape
display_mirror_x = 0
display_mirror_y = 0
min_exposure_time = 0.1
max_exposure_time = 120
min_initial_exposure_time = 0.1
max_initial_exposure_time = 300
sla_archive_format = GOO
sla_output_precision = 0.001
thumbnails = 224x168

# Additional MSLA machines. The generic entries name their own panel, so
# choosing one by name cannot misdescribe a machine. The Saturn 3 Ultra
# geometry comes from MSlicer's own source; the brand machines below it
# come from the UVtools machine database, with the output format set to
# each machine's native ctb or goo. Brands whose native format this
# engine cannot write (Anycubic, Creality Halot, Nova3D, Longer,
# FlashForge, and others) are left out on purpose instead of being
# shipped with a file their firmware cannot read.

